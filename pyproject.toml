[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csa"
version = "0.1.0"
description = "Constitutional Society of Agents - runtime (Phase 1: durable task and agent state)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
csa = "csa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
